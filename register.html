<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Styles/registerStyles.css">
    <title>Register</title>
</head>
<body>

    <div class="form-container">
         <H1>Register</H1>

            <form action ="register.php" method="POST">

                <div class="form-group">
                    <input type="text" name="username" placeholder="Enter Username">
                </div>

                <div class="form-group">
                    <input type="text" name="email" placeholder="Enter Email">
                </div>

                <div class="form-group">
                    <input type="password" name="password" placeholder="Enter Password">
                </div>

                <div class="form-group">
                    <input type="password" name="confirmPassword" placeholder="Confirm Password">
                </div>

                <div class="form-group">
                    <label for="TypeSelection">Select User Type:</label>
                    <select name="TypeSelection" id="TypeSelection" required>
                        <option value="" disabled selected>--Choose User Type--</option>
                        <option value="Buyer">Buyer</option>
                        <option value="Seller">Seller</option>
                    </select>
                </div>

                <div class="form-group" id="buyer">
                    <input type="text" name="address" placeholder="Add Address">
                </div>

                <!--Create Bank Selection-->
                <div class="form-group" id="seller"> 
                    <label for="bankName">Select your bank:</label>
                    <select name="bankName" id="bankName">
                       <option value="" disabled selected>--Choose a Bank--</option>
                       <option value="Absa">Absa</option>
                       <option value="Capetic">Capetic</option>
                       <option value="FNB">First National Bank</option>
                       <option value="NedBank">NedBank</option>
                        <option value="StandardBank">Standard Bank</option>

                    </select>
                </div>

                <div class="form-group" id="seller">
                    <input type="text" name="accountNumber" placeholder="Enter Account Number">
                </div>

                <button type="submit">Register</button>

            </form>
            <a href="login.php" class="register"><h3>Login</h3></a>
    </div>
</body>
</html>
